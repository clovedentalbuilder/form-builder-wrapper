<fx-component [fxData]="fxData" #fxComponent>
  <div class="img-upl-field">
    <label class="img-upl-label" *ngIf="setting('label')">
      {{ setting('label') }}
      <span class="img-upl-required" *ngIf="setting('isUploaderRequired') === 'true'">*</span>
    </label>

    <input
      #fileInput
      type="file"
      accept="image/*"
      [multiple]="setting('multiple-upload')"
      (change)="onFileSelected($event)"
      hidden
    />

    <div class="img-upl-grid">
      <div class="img-upl-thumb" *ngFor="let file of uploadedFiles; let i = index">
        <img class="img-upl-thumb-img" [src]="file?.result" (click)="onImageSelect(file?.result)" alt="preview" *ngIf="file?.result" />
        <button type="button" class="img-upl-remove" (click)="deleteFile(i)" title="Remove">&times;</button>
      </div>

      <div class="img-upl-dropzone" *ngIf="canAddMore" (click)="openFileDialog()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1.5" y="3.5" width="17" height="13" rx="1.5" stroke="#94a3b8" stroke-width="1.3" />
          <circle cx="6.5" cy="8" r="1.3" fill="#94a3b8" />
          <path d="M2.5 14.5L7 10.5L10 13L13.5 9L17.5 14.5" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="img-upl-dropzone-text">{{ setting('uploadText') }}</span>
      </div>
    </div>

    <small class="img-upl-error" *ngIf="uploadError">{{ uploadError }}</small>
    <small
      class="img-upl-error"
      *ngIf="!uploadError && uploadFileControl?.errors?.['required'] && uploadFileControl?.touched"
    >
      {{ setting('uploaderErrorMessage') }}
    </small>
  </div>

  <!-- Image Preview Dialog -->
  <p-dialog header="Image Preview" [modal]="true" [draggable]="false" [(visible)]="visible" [style]="{ width: '70rem' }" (onHide)="closeDialog()">
    <img [src]="selecteImageUrl" style="max-width: 100%;" />
  </p-dialog>
</fx-component>
