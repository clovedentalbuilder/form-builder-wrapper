<lib-custom-password-settings-panel
  [fxData]="fxData"
  (configuration)="onSettingsChanged($event)"
  #base
>
  <div class="cpw-field">
    <label class="cpw-label" *ngIf="setting('label')">
      {{ setting('label') }}
      <span class="cpw-required" *ngIf="isOn('isRequired')">*</span>
    </label>
    <div class="cpw-input-wrap">
      <input
        [type]="inputType"
        class="cpw-input"
        [class.cpw-input--error]="errorMessage"
        [formControl]="control"
        [placeholder]="setting('placeholder')"
        [disabled]="fieldDisabled"
        [attr.maxlength]="setting('maxLength') || null"
        autocomplete="new-password"
      />
      <button
        type="button"
        class="cpw-reveal"
        (click)="toggleReveal()"
        [disabled]="fieldDisabled"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        [title]="showPassword ? 'Hide password' : 'Show password'"
      >
        <i class="pi" [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
      </button>
    </div>
    <div class="cpw-help" *ngIf="setting('helpText') && !errorMessage">{{ setting('helpText') }}</div>
    <div class="cpw-error" *ngIf="errorMessage">{{ errorMessage }}</div>
  </div>
</lib-custom-password-settings-panel>
